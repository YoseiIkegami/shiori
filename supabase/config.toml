# A string used to distinguish different Supabase projects on the same host
project_id = "shiori"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.reveal-photos]
verify_jwt = true

[functions.create-trip-checkout]
verify_jwt = true

[functions.manage-trip]
verify_jwt = true

# Stripe posts directly with its own signature — no Supabase JWT.
[functions.stripe-webhook]
verify_jwt = false

[functions.report-photo]
verify_jwt = true

# Invoked by cron / ops; optional CRON_SECRET header. No end-user JWT.
[functions.purge-expired-trips]
verify_jwt = false
